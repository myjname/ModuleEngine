[package]
name = "module-engine-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ui = ["dep:eframe", "dep:winit", "module-engine-arpg?/ui", "module-engine-project-puzzle?/ui"]
arpg = ["dep:module-engine-arpg"]
puzzle = ["dep:module-engine-project-puzzle"]
vulkan = ["dep:module-engine-vulkan"]
audio = ["module-engine-host-services/audio"]

[dependencies]
module-engine-core = { path = "../engine-core" }
module-engine-host = { path = "../game-host" }
module-engine-host-services = { path = "../host-services", default-features = false }
module-engine-project = { path = "../project-tools" }
module-engine-arpg = { path = "../gameplay-arpg", optional = true }
module-engine-project-puzzle = { path = "../project-puzzle", optional = true }
module-engine-vulkan = { path = "../render-vulkan", optional = true }
eframe = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
png.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, optional = true, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland", "wayland-dlopen", "x11"], optional = true }

[dev-dependencies]
module-engine-two-arenas = { path = "../example-two-arenas" }
