[workspace]
members = ["crates/engine-core", "crates/custom-rust", "crates/editor", "crates/render-vulkan", "crates/runtime-script", "crates/project-tools", "crates/engine-content"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "__screenshot"] }
png = "0.18"

[profile.release]
opt-level = 2

